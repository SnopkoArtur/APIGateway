server:
  port: ${API_GATEWAY_PORT}

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtFilter

        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/v1/users/**, /api/v1/cards/**
          filters:
            - name: JwtFilter

        - id: order-service
          uri: ${ORDER_SERVICE_URL}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: JwtFilter

services:
  auth-url: ${AUTH_SERVICE_URL}
  user-url: ${USER_SERVICE_URL}

jwt:
  key: ${JWT_KEY}