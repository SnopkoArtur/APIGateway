version: '3.8'

services:
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${DB_NAME_AUTH}
      POSTGRES_USER: ${DB_USERNAME_AUTH}
      POSTGRES_PASSWORD: ${DB_PASSWORD_AUTH}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: ${DB_NAME_USER}
      POSTGRES_USER: ${DB_USERNAME_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ${DB_NAME_ORDER}
      POSTGRES_USER: ${DB_USERNAME_ORDER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ORDER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: mongo:6.0
    container_name: payment-db-container
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME_PAYMENT}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME_PAYMENT}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD_PAYMENT}
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  redis:
    image: redis:7-alpine
    container_name: user-redis
    ports:
      - "6379:6379"

  auth-service:
    build: ../AuthService
    container_name: auth-service-app
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/${DB_NAME_AUTH}
      DB_USERNAME: ${DB_USERNAME_AUTH}
      DB_PASSWORD: ${DB_PASSWORD_AUTH}
      JWT_KEY: ${JWT_KEY}
      SERVER_PORT: ${AUTH_PORT}
    depends_on:
      auth-db:
        condition: service_healthy

  user-service:
    build: ../UserService
    container_name: user-service-app
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/${DB_NAME_USER}
      DB_USERNAME: ${DB_USERNAME_USER}
      DB_PASSWORD: ${DB_PASSWORD_USER}
      REDIS_HOST: redis
      JWT_KEY: ${JWT_KEY}
      SERVER_PORT: ${USER_PORT}
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_started

  order-service:
    build: ../OrderService
    container_name: order-service-app
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/${DB_NAME_ORDER}
      DB_USERNAME: ${DB_USERNAME_ORDER}
      DB_PASSWORD: ${DB_PASSWORD_ORDER}
      USER_SERVICE_URL: http://user-service-app:${USER_PORT}
      JWT_KEY: ${JWT_KEY}
      SERVER_PORT: ${ORDER_PORT}
    depends_on:
      order-db:
        condition: service_healthy
      user-service:
        condition: service_started

  payment-service:
    build: ../PaymentService
    container_name: payment-service-app
    environment:
      MONGO_URI: mongodb://${DB_USERNAME_PAYMENT}:${DB_PASSWORD_PAYMENT}@payment-db:27017/${DB_NAME_PAYMENT}?authSource=admin
      KAFKA_URL: kafka:29092
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      JWT_KEY: ${JWT_KEY}
      SERVER_PORT: ${PAYMENT_PORT}
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
      bank-mock:
        condition: service_started

  api-gateway:
    build: .
    container_name: api-gateway-app
    ports:
      - "${API_GATEWAY_PORT}:8083"
    environment:
      AUTH_SERVICE_URL: http://auth-service-app:${AUTH_PORT}
      USER_SERVICE_URL: http://user-service-app:${USER_PORT}
      ORDER_SERVICE_URL: http://order-service-app:${ORDER_PORT}
      PAYMENT_SERVICE_URL: http://payment-service-app:${PAYMENT_PORT}
      JWT_KEY: ${JWT_KEY}
    depends_on:
      - auth-service
      - user-service
      - order-service
      - payment-service